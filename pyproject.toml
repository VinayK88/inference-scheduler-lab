[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-scheduler-lab"
version = "0.1.0"
description = "A deterministic LLM-serving scheduler simulator for latency, throughput, SLO, and KV-cache trade-offs."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Vinay K"}]
dependencies = []

[project.scripts]
inference-scheduler-lab = "inference_scheduler_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
