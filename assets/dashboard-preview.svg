<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Inference Scheduler Lab dashboard preview</title><desc id="desc">Static synthetic dashboard preview for inference scheduling, throughput, tail latency, SLO attainment, fairness, and KV-cache pressure.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#14263a"/></linearGradient></defs><rect width="1200" height="640" rx="24" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="48" y="58" font-size="30" font-weight="800" fill="#f8fafc">Inference Scheduler Lab</text><text x="48" y="87" font-size="13" font-weight="700" letter-spacing="1.4" fill="#93c5fd">THROUGHPUT · TAIL LATENCY · TTFT · SLO · KV PRESSURE</text><text x="1148" y="63" text-anchor="end" font-size="12" font-weight="700" fill="#94a3b8">STATIC / SYNTHETIC PREVIEW</text><rect x="48" y="118" width="255" height="92" rx="15" fill="#101d2d" stroke="#32465f"/><text x="68" y="147" font-size="11" font-weight="700" fill="#94a3b8">WORKLOAD</text><text x="68" y="184" font-size="24" font-weight="800" fill="#f8fafc">BURSTY MIXED</text><rect x="323" y="118" width="255" height="92" rx="15" fill="#101d2d" stroke="#32465f"/><text x="343" y="147" font-size="11" font-weight="700" fill="#94a3b8">POLICIES</text><text x="343" y="184" font-size="24" font-weight="800" fill="#93c5fd">4 COMPARED</text><rect x="598" y="118" width="255" height="92" rx="15" fill="#101d2d" stroke="#32465f"/><text x="618" y="147" font-size="11" font-weight="700" fill="#94a3b8">RESOURCE GATE</text><text x="618" y="184" font-size="24" font-weight="800" fill="#c4b5fd">KV CAPACITY</text><rect x="873" y="118" width="279" height="92" rx="15" fill="#101d2d" stroke="#32465f"/><text x="893" y="147" font-size="11" font-weight="700" fill="#94a3b8">DECISION</text><text x="893" y="184" font-size="24" font-weight="800" fill="#4ade80">TRADE-OFF</text><rect x="48" y="236" width="535" height="306" rx="18" fill="#0d1725" stroke="#32465f"/><text x="72" y="272" font-size="18" font-weight="800" fill="#f8fafc">Policy comparison</text><text x="72" y="298" font-size="12" fill="#94a3b8">Same trace; different admission and refill behavior</text><rect x="72" y="333" width="438" height="36" rx="9" fill="#172033"/><rect x="72" y="333" width="125" height="36" rx="9" fill="#475569"/><text x="88" y="357" font-size="12" font-weight="800" fill="#f8fafc">FCFS</text><rect x="72" y="384" width="438" height="36" rx="9" fill="#172033"/><rect x="72" y="384" width="244" height="36" rx="9" fill="#2563eb"/><text x="88" y="408" font-size="12" font-weight="800" fill="#dbeafe">STATIC BATCH</text><rect x="72" y="435" width="438" height="36" rx="9" fill="#172033"/><rect x="72" y="435" width="365" height="36" rx="9" fill="#0f766e"/><text x="88" y="459" font-size="12" font-weight="800" fill="#ccfbf1">CONTINUOUS BATCH</text><rect x="72" y="486" width="438" height="36" rx="9" fill="#172033"/><rect x="72" y="486" width="352" height="36" rx="9" fill="#6d28d9"/><text x="88" y="510" font-size="12" font-weight="800" fill="#ede9fe">SLO-AWARE</text><rect x="607" y="236" width="545" height="306" rx="18" fill="#0d1725" stroke="#32465f"/><text x="631" y="272" font-size="18" font-weight="800" fill="#f8fafc">Serving decision checklist</text><text x="631" y="298" font-size="12" fill="#94a3b8">A throughput winner can still be a bad policy</text><circle cx="637" cy="347" r="6" fill="#60a5fa"/><text x="655" y="352" font-size="14" font-weight="650" fill="#dbeafe">Output tokens / second</text><circle cx="637" cy="395" r="6" fill="#f59e0b"/><text x="655" y="400" font-size="14" font-weight="650" fill="#dbeafe">p95 latency + p95 time-to-first-token</text><circle cx="637" cy="443" r="6" fill="#4ade80"/><text x="655" y="448" font-size="14" font-weight="650" fill="#dbeafe">SLO attainment + fairness</text><circle cx="637" cy="491" r="6" fill="#a78bfa"/><text x="655" y="496" font-size="14" font-weight="650" fill="#dbeafe">Peak KV allocation and capacity safety</text><text x="48" y="592" font-size="12" fill="#94a3b8">Preview represents deterministic simulator results and abstractions; it is not a benchmark of a specific GPU, model, or serving framework.</text></g></svg>